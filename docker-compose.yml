services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      - audit-data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  audit-data:
