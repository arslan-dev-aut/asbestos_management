services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - ${USERPROFILE}/.azure:/root/.azure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - BACKEND_UPSTREAM=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
