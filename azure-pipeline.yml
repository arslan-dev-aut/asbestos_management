trigger:
  branches:
    include:
      - uat
      - staging
      - main
variables:
  # Select variable groups + settings based on the branch being deployed.
  # - uat -> groups starting with `uat`
  # - staging -> groups starting with `Staging`
  # - live/main -> groups starting with `Live`
  - ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
      - group: UATContainerAppVariables

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
      - group: StgContainerAppVariables

  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      - group: LiveContainerAppVariables

pool:
  name: "$(poolName)"

stages:
- stage: Build
  displayName: Build & Push Images
  jobs:
    - job: BuildAndPush
      displayName: Build & Push
      steps:
        - task: Docker@2
          displayName: buildAndPush
          inputs:
            command: "buildAndPush"
            containerRegistry: "$(containerRegistry)"
            repository: "$(CONTAINERNAME)"
            Dockerfile: "**/Dockerfile"
            tags: |
              $(Build.BuildId)

- stage: DeployMain
  displayName: "Deploy to Azure (main, approval)"
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: Deploy
      displayName: "Deploy to Azure Container App"
      environment: "Approval for YAML Pipelines"
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureCLI@2
                displayName: "Deploy (Container App or Job)"
                inputs:
                  azureSubscription: "$(azureSubscription)" # Azure service connection
                  scriptType: "bash"
                  scriptLocation: "scriptPath"
                  scriptPath: "$(Build.SourcesDirectory)/deploy/containerapp.sh"

- stage: DeployNonMain
  displayName: "Deploy to Azure (non-main)"
  dependsOn: Build
  condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: Deploy
      displayName: "Deploy to Azure Container App"
      steps:
        - task: AzureCLI@2
          displayName: "Deploy (Container App or Job)"
          inputs:
            azureSubscription: "$(azureSubscription)" # Azure service connection
            scriptType: "bash"
            scriptLocation: "scriptPath"
            scriptPath: "$(Build.SourcesDirectory)/deploy/containerapp.sh"

- stage: UpdateAutomationsHub
  displayName: 'Update Container-Automations-Hub Submodule'
  dependsOn:
    - DeployMain
    - DeployNonMain
  # Run after whichever deploy stage ran successfully (other may be skipped).
  condition: or(eq(dependencies.DeployMain.result, 'Succeeded'), eq(dependencies.DeployNonMain.result, 'Succeeded'))
  jobs:
    - job: UpdateHub
      displayName: 'Create/Update submodule in hub'
      steps:
      - checkout: self
        persistCredentials: true

      - bash: |
          bash "$(Build.SourcesDirectory)/deploy/update-hub-submodule.sh"
        displayName: 'Update hub submodule pointer'
