server {
    listen       80;
    root         /usr/share/nginx/html;
    index        index.html;

    # Resolver is injected at container startup from /etc/resolv.conf via envsubst.
    # This makes the config portable across Docker (127.0.0.11) and ACA (kube-dns).
    resolver ${NGINX_RESOLVER} valid=10s;

    # SPA routing — serve index.html for all 404s
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to the backend.
    # BACKEND_UPSTREAM is injected at container startup via envsubst.
    # Set it to the backend's URL for each environment:
    #   docker-compose : BACKEND_UPSTREAM=http://backend:8000
    #   ACA            : BACKEND_UPSTREAM=http://<backend-container-app-name>
    location /api {
        set $backend ${BACKEND_UPSTREAM};
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;   # 10 min — matches SQL timeout
    }
}
