[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:backend]
command=uvicorn backend.main:app --host 127.0.0.1 --port 8000 --timeout-keep-alive 75
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
# Block until uvicorn is actually listening on :8000 before launching nginx.
# `priority` only orders the spawn — it does NOT wait for the previous program
# to be READY. Without this gate nginx happily forwards traffic for the few
# seconds uvicorn takes to bind the socket, producing first-request 502s.
command=sh -c 'echo "[nginx] waiting for backend :8000..."; while ! nc -z 127.0.0.1 8000 2>/dev/null; do sleep 0.3; done; echo "[nginx] backend up — starting"; exec nginx -g "daemon off;"'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0